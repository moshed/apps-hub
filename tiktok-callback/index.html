<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Shop authorization</title>
<meta name="robots" content="noindex">
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e7e9ee;
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
.card{max-width:620px;width:100%;background:#161a21;border:1px solid #242833;border-radius:14px;padding:28px}
h1{font-size:20px;margin:0 0 6px}
p.sub{color:#9aa2b1;font-size:14px;margin:0 0 22px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#9aa2b1;margin:18px 0 6px}
code{display:block;background:#0f1115;border:1px solid #242833;border-radius:9px;padding:12px 14px;
font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#e7e9ee}
button{margin-top:18px;background:#1f5fd0;color:#fff;border:0;border-radius:9px;padding:11px 18px;
font-size:15px;font-weight:600;cursor:pointer}
button:hover{background:#2a6ee0}
.none{color:#9aa2b1}
.ok{color:#59d18b;font-size:14px;margin-top:10px;min-height:20px}
</style>
</head><body>
<div class="card">
<h1>TikTok Shop authorization</h1>
<p class="sub">Copy the whole line below and send it to Claude. It expires in minutes, so do it now.</p>
<label>Authorization code</label>
<code id="code" class="none">No code in this URL.</code>
<label>Full callback URL</label>
<code id="full"></code>
<button id="copy">Copy the code</button>
<div class="ok" id="ok"></div>
</div>
<script>
var q = new URLSearchParams(location.search);
var code = q.get("code") || q.get("auth_code") || "";
var el = document.getElementById("code");
if (code) { el.textContent = code; el.classList.remove("none"); }
document.getElementById("full").textContent = location.href;
document.getElementById("copy").onclick = function () {
  navigator.clipboard.writeText(code || location.href).then(function () {
    document.getElementById("ok").textContent = "Copied. Paste it to Claude.";
  });
};
</script>
</body></html>
