<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dancykier Projects</title>
<meta name="description" content="Everything Moshe Dancykier has built — iOS apps, web games, Mac utilities and Twitter bots, in one place.">
<meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<script>
  // Set the theme before first paint so the page never flashes the wrong one.
  (function(){
    try{
      var t = localStorage.getItem('theme');
      if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>
  /* ---- Light palette (default) ---------------------------------------- */
  :root{
    --bg:#f5f6f9;
    --glow-1:rgba(64,120,255,.10);
    --glow-2:rgba(20,180,130,.09);
    --panel:#ffffff;
    --panel-2:#f0f2f6;
    --panel-3:#e7eaf1;
    --border:#dfe3ec;
    --border-soft:#e8ebf2;
    --border-hover:#c3ccdd;
    --text:#101827;
    --dim:#5a6579;
    --mute:#8b94a6;
    --accent:#2f6bf0;
    --accent-soft:rgba(47,107,240,.12);
    --shadow:0 1px 2px rgba(16,24,39,.05), 0 8px 24px -12px rgba(16,24,39,.14);
    --shadow-hover:0 2px 4px rgba(16,24,39,.06), 0 20px 40px -18px rgba(16,24,39,.28);
    --plat-bg:rgba(255,255,255,.82);
    --plat-fg:#3c4657;
    --plat-br:rgba(16,24,39,.10);
    --tile-mix:38%;
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  /* ---- Dark palette ---------------------------------------------------- */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1017;
      --glow-1:rgba(110,163,255,.10);
      --glow-2:rgba(72,213,151,.07);
      --panel:#141c29;
      --panel-2:#18212f;
      --panel-3:#1e2a3b;
      --border:#243247;
      --border-soft:#1b2432;
      --border-hover:#3a4d6b;
      --text:#e8eef6;
      --dim:#93a4ba;
      --mute:#5f7089;
      --accent:#6ea3ff;
      --accent-soft:rgba(110,163,255,.16);
      --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 26px -14px rgba(0,0,0,.70);
      --shadow-hover:0 2px 6px rgba(0,0,0,.36), 0 24px 48px -20px rgba(0,0,0,.85);
      --plat-bg:rgba(11,16,23,.62);
      --plat-fg:#cdd8e6;
      --plat-br:rgba(255,255,255,.09);
      --tile-mix:0%;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1017;
    --glow-1:rgba(110,163,255,.10);
    --glow-2:rgba(72,213,151,.07);
    --panel:#141c29;
    --panel-2:#18212f;
    --panel-3:#1e2a3b;
    --border:#243247;
    --border-soft:#1b2432;
    --border-hover:#3a4d6b;
    --text:#e8eef6;
    --dim:#93a4ba;
    --mute:#5f7089;
    --accent:#6ea3ff;
    --accent-soft:rgba(110,163,255,.16);
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 10px 26px -14px rgba(0,0,0,.70);
    --shadow-hover:0 2px 6px rgba(0,0,0,.36), 0 24px 48px -20px rgba(0,0,0,.85);
    --plat-bg:rgba(11,16,23,.62);
    --plat-fg:#cdd8e6;
    --plat-br:rgba(255,255,255,.09);
    --tile-mix:0%;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 620px at 78% -10%, var(--glow-1), transparent 62%),
      radial-gradient(900px 520px at 6% 2%, var(--glow-2), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .wrap{max-width:1200px; margin:0 auto; padding:0 22px 90px}

  /* ---- Header ---------------------------------------------------------- */
  header.top{padding:52px 0 6px; display:flex; align-items:flex-start; gap:20px}
  .head-txt{flex:1; min-width:0}
  .eyebrow{display:inline-flex; align-items:center; gap:7px; color:var(--accent);
    font:600 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; margin:0 0 15px}
  .eyebrow::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;
    box-shadow:0 0 0 4px var(--accent-soft)}
  h1{margin:0; font:800 clamp(31px,5.2vw,50px)/1.02 var(--sans); letter-spacing:-.03em}
  h1 .dot{color:var(--accent)}
  .lede{color:var(--dim); font-size:16px; margin:14px 0 0; max-width:58ch}
  .lede b{color:var(--text); font-weight:600}

  .theme-btn{flex:0 0 auto; margin-top:4px; width:40px; height:40px; display:grid; place-items:center;
    border-radius:12px; border:1px solid var(--border); background:var(--panel); color:var(--dim);
    cursor:pointer; box-shadow:var(--shadow); transition:color .15s, border-color .15s, transform .15s}
  .theme-btn:hover{color:var(--text); border-color:var(--border-hover); transform:translateY(-1px)}
  .theme-btn svg{width:19px; height:19px; display:none}
  .theme-btn .i-sun{display:block}
  :root[data-theme="dark"] .theme-btn .i-sun{display:none}
  :root[data-theme="dark"] .theme-btn .i-moon{display:block}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-btn .i-sun{display:none}
    :root:not([data-theme="light"]) .theme-btn .i-moon{display:block}
  }

  /* ---- Search + filters ------------------------------------------------ */
  .toolbar{position:sticky; top:0; z-index:20; margin:26px 0 2px; padding:14px 0 12px;
    background:linear-gradient(var(--bg) 70%, transparent); backdrop-filter:saturate(150%) blur(6px)}
  .search{position:relative; display:flex; align-items:center}
  .search > svg{position:absolute; left:16px; width:18px; height:18px; color:var(--mute); pointer-events:none}
  #q{width:100%; padding:14px 16px 14px 46px; font:500 15px/1 var(--sans); color:var(--text);
     background:var(--panel); border:1px solid var(--border); border-radius:13px; outline:none;
     box-shadow:var(--shadow); transition:border-color .15s, box-shadow .15s}
  #q::placeholder{color:var(--mute)}
  #q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .kbd{position:absolute; right:14px; color:var(--mute); font:600 11px/1 var(--mono);
    border:1px solid var(--border); border-radius:5px; padding:4px 6px; pointer-events:none}
  #q:focus ~ .kbd, #q:not(:placeholder-shown) ~ .kbd{opacity:0}

  .pills{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
  .pill{font:600 12px/1 var(--sans); letter-spacing:-.005em; color:var(--dim); background:var(--panel);
    border:1px solid var(--border); border-radius:999px; padding:7px 13px; cursor:pointer;
    transition:color .13s, border-color .13s, background .13s}
  .pill:hover{color:var(--text); border-color:var(--border-hover)}
  .pill[aria-pressed="true"]{color:#fff; background:var(--accent); border-color:var(--accent)}
  .pill .n{opacity:.6; margin-left:5px; font:600 11px/1 var(--mono)}

  /* ---- Sections -------------------------------------------------------- */
  section{margin-top:34px; scroll-margin-top:130px}
  .sec-head{display:flex; align-items:baseline; gap:10px; margin:0 2px 15px; padding-bottom:12px;
    border-bottom:1px solid var(--border-soft)}
  .sec-head h2{margin:0; font:700 15px/1 var(--sans); letter-spacing:-.015em}
  .sec-head .count{color:var(--mute); font:600 11px/1 var(--mono)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(278px,1fr)); gap:16px}

  /* ---- Card ------------------------------------------------------------ */
  .card{position:relative; display:flex; flex-direction:column; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--border); border-radius:17px; overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease}
  a.card:hover{transform:translateY(-4px); border-color:var(--border-hover); box-shadow:var(--shadow-hover)}
  a.card:active{transform:translateY(-1px)}
  a.card:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .card.nolink{cursor:default}

  .thumb{position:relative; aspect-ratio:16/10; width:100%; overflow:hidden; background:var(--panel-3);
    border-bottom:1px solid var(--border-soft)}
  .thumb img.shot{width:100%; height:100%; object-fit:cover; object-position:top center; display:block;
    transition:transform .35s ease}
  a.card:hover .thumb img.shot{transform:scale(1.04)}
  .thumb.tile{display:grid; place-items:center}
  .thumb.tile img.bigic{width:78px; height:78px; border-radius:19px;
    box-shadow:0 12px 28px rgba(0,0,0,.36); transition:transform .35s ease}
  a.card:hover .thumb.tile img.bigic{transform:scale(1.06)}
  .thumb .plat{position:absolute; top:10px; left:10px; font:600 9.5px/1 var(--mono); letter-spacing:.05em;
    color:var(--plat-fg); background:var(--plat-bg); backdrop-filter:blur(4px);
    padding:5px 8px; border-radius:7px; border:1px solid var(--plat-br)}
  .thumb.tile .plat{color:#cdd8e6; background:rgba(11,16,23,.5); border-color:rgba(255,255,255,.12)}

  .meta{padding:13px 14px 15px; display:flex; align-items:center; gap:11px}
  .meta .ic{flex:0 0 32px; width:32px; height:32px; border-radius:9px; object-fit:cover;
    background:var(--panel-3); border:1px solid var(--border-soft)}
  .meta .txt{min-width:0; flex:1}
  .name{display:flex; align-items:center; gap:8px; font:700 14.5px/1.2 var(--sans); letter-spacing:-.015em}
  .desc{color:var(--dim); font-size:12.5px; line-height:1.45; margin:4px 0 0}

  .badge{flex:0 0 auto; margin-left:auto; align-self:flex-start; margin-top:2px;
    font:600 9px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase;
    padding:5px 7px; border-radius:6px; border:1px solid transparent; white-space:nowrap}
  .b-store{color:#1b47a8; background:rgba(47,107,240,.10); border-color:rgba(47,107,240,.26)}
  .b-live {color:#0a6b46; background:rgba(20,170,120,.11); border-color:rgba(20,170,120,.28)}
  .b-mac  {color:#6b2f8a; background:rgba(150,80,190,.10); border-color:rgba(150,80,190,.26)}
  .b-beta {color:#8a5411; background:rgba(230,150,40,.12); border-color:rgba(230,150,40,.30)}
  .b-x    {color:#3a4657; background:rgba(90,120,150,.11); border-color:rgba(90,120,150,.28)}
  :root[data-theme="dark"] .b-store{color:#bcd4ff; background:rgba(110,163,255,.13); border-color:rgba(110,163,255,.28)}
  :root[data-theme="dark"] .b-live {color:#8ff0c4; background:rgba(72,213,151,.12); border-color:rgba(72,213,151,.28)}
  :root[data-theme="dark"] .b-mac  {color:#e9d6ff; background:rgba(179,132,181,.14); border-color:rgba(179,132,181,.30)}
  :root[data-theme="dark"] .b-beta {color:#ffd9a6; background:rgba(255,180,74,.12); border-color:rgba(255,180,74,.30)}
  :root[data-theme="dark"] .b-x    {color:#cfe0ee; background:rgba(120,150,180,.14); border-color:rgba(150,175,200,.30)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .b-store{color:#bcd4ff; background:rgba(110,163,255,.13); border-color:rgba(110,163,255,.28)}
    :root:not([data-theme="light"]) .b-live {color:#8ff0c4; background:rgba(72,213,151,.12); border-color:rgba(72,213,151,.28)}
    :root:not([data-theme="light"]) .b-mac  {color:#e9d6ff; background:rgba(179,132,181,.14); border-color:rgba(179,132,181,.30)}
    :root:not([data-theme="light"]) .b-beta {color:#ffd9a6; background:rgba(255,180,74,.12); border-color:rgba(255,180,74,.30)}
    :root:not([data-theme="light"]) .b-x    {color:#cfe0ee; background:rgba(120,150,180,.14); border-color:rgba(150,175,200,.30)}
  }

  .thumb.tile.bot img.bigic{width:106px; height:106px; border-radius:50%; border:3px solid rgba(255,255,255,.16)}
  .handle{color:var(--mute); font:600 11px/1 var(--mono)}

  .empty{display:none; color:var(--mute); font-size:14px; padding:28px 2px}
  section.hidden{display:none}

  /* ---- Footer ---------------------------------------------------------- */
  .sitelinks{margin-top:48px; padding-top:22px; border-top:1px solid var(--border-soft)}
  .sitelinks h2{font-size:12px; font-weight:700; color:var(--mute); text-transform:uppercase;
    letter-spacing:.09em; margin:0 0 12px}
  .sitelinks ul{list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:9px 18px}
  .sitelinks a{color:var(--dim); text-decoration:none; font-size:13.5px}
  .sitelinks a:hover{color:var(--accent); text-decoration:underline}
  footer{margin-top:40px; padding-top:22px; border-top:1px solid var(--border-soft);
    color:var(--mute); font-size:12.5px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
  footer a{color:var(--dim); text-decoration:none}
  footer a:hover{color:var(--accent)}

  @media (max-width:560px){
    header.top{padding:36px 0 4px}
    .grid{grid-template-columns:1fr}
    .kbd{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="head-txt">
      <p class="eyebrow">dancykier.com</p>
      <h1>Everything I've built<span class="dot">.</span></h1>

    </div>
    <button class="theme-btn" id="theme" type="button" aria-label="Switch between light and dark mode" title="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>

    </button>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Filter apps…" autocomplete="off" spellcheck="false" aria-label="Filter apps">
      <span class="kbd">/</span>
    </div>
    <div class="pills" id="pills" role="group" aria-label="Filter by category"></div>
  </div>

  <main id="sections"></main>
  <p class="empty" id="empty">No apps match that.</p>

  <nav class="sitelinks" aria-label="All projects">

  </nav>

  <footer>
    <span>Built by Moshe Dancykier</span>
    <span><a href="mailto:general@dancykier.com">general@dancykier.com</a></span>
  </footer>
</div>

];

const BADGE = { store:["b-store","App Store"], live:["b-live","Live"], mac:["b-mac","macOS"], beta:["b-beta","TestFlight"], x:["b-x","X"] };
const PLAT  = { store:"iOS", live:"iOS", beta:"iOS", mac:"macOS", x:"X" };
const V = 6;

const secWrap = document.getElementById('sections');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

SECTIONS.forEach((sec, si)=>{
  const isWeb = sec.title.startsWith("Web");
  const s = document.createElement('section');
  s.dataset.sec = si;
  s.innerHTML = `<div class="sec-head"><h2>${esc(sec.title)}</h2><span class="count">${sec.apps.length}</span></div>`;
  const grid = document.createElement('div'); grid.className='grid';
  sec.apps.forEach(a=>{
    const [bc,bl] = BADGE[a.b] || BADGE.live;
    const linked = !!a.u;
    const plat = isWeb ? "Web" : PLAT[a.b];
    const el = document.createElement(linked?'a':'div');
    el.className = 'card' + (linked?'':' nolink');
    if(linked){ el.href=a.u; el.target='_blank'; el.rel='noopener'; }
    el.dataset.k = (a.n+' '+a.d+' '+(a.h||'')+' '+sec.title).toLowerCase();
    const thumb = a.s
      ? `<div class="thumb"><span class="plat">${plat}</span><img class="shot" loading="lazy" src="thumbs/${a.s}.jpg?v=${V}" alt="${esc(a.n)} screenshot"></div>`
      : `<div class="thumb tile${a.bot?' bot':''}" style="background:linear-gradient(150deg, ${a.t?a.t[0]:'#1e2a3b'}, ${a.t?a.t[1]:'#141c29'})"><span class="plat">${plat}</span><img class="bigic" loading="lazy" src="icons/${a.ic}.png?v=${V}" alt="${esc(a.n)} icon"></div>`;
    el.innerHTML = thumb +
      `<div class="meta">`+
        `<img class="ic" loading="lazy" src="icons/${a.ic}.png?v=${V}" alt="">`+
        `<div class="txt">`+
          `<div class="name">${esc(a.n)}${a.h?` <span class="handle">${esc(a.h)}</span>`:''}</div>`+
          `<p class="desc">${esc(a.d)}</p>`+
        `</div>`+
        `<span class="badge ${bc}">${esc(a.cta||bl)}</span>`+
      `</div>`;
    grid.appendChild(el);
  });
  s.appendChild(grid);
  secWrap.appendChild(s);
});

// ---- Category pills ----------------------------------------------------
const pillWrap = document.getElementById('pills');
let activeSec = null;
const mkPill = (label, count, sec)=>{
  const b = document.createElement('button');
  b.type='button'; b.className='pill'; b.setAttribute('aria-pressed', sec===activeSec);
  b.innerHTML = esc(label) + (count!=null?` <span class="n">${count}</span>`:'');
  b.onclick = ()=>{ activeSec = (activeSec===sec) ? null : sec; render(); };
  return b;
};
const total = SECTIONS.reduce((t,s)=>t+s.apps.length,0);

// ---- All-projects list -------------------------------------------------
const linkWrap = document.getElementById('sitelinks');
SECTIONS.forEach(sec => sec.apps.forEach(a=>{
  if(!a.u) return;
  const li = document.createElement('li');
  li.innerHTML = `<a href="${a.u}">${esc(a.n)}</a>`;
  linkWrap.appendChild(li);
}));

// ---- Filtering ---------------------------------------------------------
const q = document.getElementById('q'), empty = document.getElementById('empty');
function render(){
  pillWrap.innerHTML='';
  pillWrap.appendChild(mkPill('All', total, null));
  SECTIONS.forEach((s,i)=> pillWrap.appendChild(mkPill(s.title, s.apps.length, i)));

  const term = q.value.trim().toLowerCase();
  let any=false;
  document.querySelectorAll('#sections section').forEach(sec=>{
    const inSec = activeSec===null || +sec.dataset.sec === activeSec;
    let shown=0;
    sec.querySelectorAll('.card').forEach(c=>{
      const hit = inSec && (!term || c.dataset.k.includes(term));
      c.style.display = hit?'':'none'; if(hit) shown++;
    });
    sec.classList.toggle('hidden', shown===0); if(shown) any=true;
  });
  empty.style.display = any?'none':'block';
}
q.addEventListener('input', render);
render();

// "/" focuses the filter box.
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value=''; render(); q.blur(); }
});

// ---- Theme toggle ------------------------------------------------------
const root = document.documentElement;
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
document.getElementById('theme').addEventListener('click', ()=>{
  const cur = root.getAttribute('data-theme') || (sysDark.matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
});
</script>
</body>
</html>
