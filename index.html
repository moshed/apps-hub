<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dancykier Projects</title>
<meta name="description" content="Everything Moshe Dancykier has built — iOS apps, web games, Mac utilities and Twitter bots, in one place.">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080b11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<script>
  // Apply the saved theme before first paint, so the page never flashes the wrong one.
  (function(){
    try{
      var t = localStorage.getItem('theme');
      if(t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
<style>
  /* ---- Light palette (default) ---------------------------------------- */
  :root{
    --bg:#fbfbfd; --panel:#fff; --panel-3:#e9ebf1;
    --border:#e4e6ee; --border-hover:#c7cddc;
    --text:#0d1220; --dim:#5c6478; --mute:#9098a8;
    --accent:#2f6bf0; --accent-soft:rgba(47,107,240,.10);
    --shadow:0 1px 2px rgba(13,18,32,.04), 0 10px 30px -16px rgba(13,18,32,.16);
    --shadow-hi:0 2px 5px rgba(13,18,32,.06), 0 26px 50px -22px rgba(13,18,32,.32);
    --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  /* ---- Dark palette ---------------------------------------------------- */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#080b11; --panel:#111823; --panel-3:#1c2634;
    --border:#212c3d; --border-hover:#36485f;
    --text:#eaf0f8; --dim:#94a3b8; --mute:#5f6d82;
    --accent:#6ea3ff; --accent-soft:rgba(110,163,255,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.9);
    --shadow-hi:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -26px rgba(0,0,0,1);
  }}
  :root[data-theme="dark"]{
    --bg:#080b11; --panel:#111823; --panel-3:#1c2634;
    --border:#212c3d; --border-hover:#36485f;
    --text:#eaf0f8; --dim:#94a3b8; --mute:#5f6d82;
    --accent:#6ea3ff; --accent-soft:rgba(110,163,255,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.9);
    --shadow-hi:0 2px 6px rgba(0,0,0,.5), 0 30px 60px -26px rgba(0,0,0,1);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--text);
    font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased; min-height:100vh}
  .wrap{max-width:1080px; margin:0 auto; padding:0 26px 110px}

  /* ---- Header ---------------------------------------------------------- */
  header.top{padding:80px 0 0; display:flex; align-items:flex-start; gap:24px}
  .head-txt{flex:1; min-width:0}
  .eyebrow{color:var(--mute); font:600 11px/1 var(--mono); letter-spacing:.18em;
    text-transform:uppercase; margin:0 0 18px}
  h1{margin:0; font:700 clamp(34px,5vw,52px)/1.05 var(--sans); letter-spacing:-.035em}
  .lede{color:var(--dim); font-size:16.5px; margin:18px 0 0; max-width:52ch}
  .theme-btn{flex:0 0 auto; margin-top:4px; width:38px; height:38px; display:grid;
    place-items:center; border-radius:50%; border:1px solid var(--border);
    background:var(--panel); color:var(--dim); cursor:pointer;
    transition:color .15s, border-color .15s}
  .theme-btn:hover{color:var(--text); border-color:var(--border-hover)}
  .theme-btn svg{width:17px; height:17px; display:none}
  .theme-btn .i-sun{display:block}
  :root[data-theme="dark"] .theme-btn .i-sun{display:none}
  :root[data-theme="dark"] .theme-btn .i-moon{display:block}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-btn .i-sun{display:none}
    :root:not([data-theme="light"]) .theme-btn .i-moon{display:block}
  }

  /* ---- Search ---------------------------------------------------------- */
  .search{position:relative; margin:40px 0 0; max-width:400px}
  #q{width:100%; padding:12px 15px 12px 40px; font:500 14.5px/1 var(--sans); color:var(--text);
    background:var(--panel); border:1px solid var(--border); border-radius:11px; outline:none;
    transition:border-color .15s, box-shadow .15s}
  #q::placeholder{color:var(--mute)}
  #q:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .search > svg{position:absolute; left:13px; top:12px; width:16px; height:16px;
    color:var(--mute); pointer-events:none}

  /* ---- Sections -------------------------------------------------------- */
  section{margin-top:52px}
  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 16px}
  .sec-head h2{margin:0; font:600 13px/1 var(--mono); letter-spacing:.13em;
    text-transform:uppercase; color:var(--mute)}
  .sec-head .rule{flex:1; height:1px; background:var(--border)}

  /* ---- Card: one shape for every app ----------------------------------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(430px,1fr)); gap:10px}
  .c{position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px;
    min-height:74px; text-decoration:none; color:inherit; border-radius:14px;
    background:var(--panel); border:1px solid var(--border); box-shadow:var(--shadow);
    transition:transform .15s, border-color .15s, box-shadow .15s}
  a.c:hover{transform:translateY(-2px); border-color:var(--border-hover); box-shadow:var(--shadow-hi)}
  a.c:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .c .ic{flex:0 0 44px; width:44px; height:44px; border-radius:11px; object-fit:cover;
    background:var(--panel-3); box-shadow:0 2px 8px rgba(13,18,32,.14)}
  .c.bot .ic{border-radius:50%}
  .c .txt{flex:1; min-width:0}
  .c .nm{display:flex; align-items:center; gap:8px; font:650 15px/1.3 var(--sans);
    letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .c .hd{color:var(--mute); font:500 11px/1 var(--mono); flex:0 0 auto}
  .c .ds{color:var(--dim); font-size:13px; margin:2px 0 0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

  .badge{flex:0 0 auto; font:600 9px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
    padding:5px 7px; border-radius:6px; border:1px solid transparent; white-space:nowrap}
  .b-store{color:#1b47a8; background:rgba(47,107,240,.10); border-color:rgba(47,107,240,.24)}
  .b-live {color:#0a6b46; background:rgba(20,170,120,.11); border-color:rgba(20,170,120,.26)}
  .b-mac  {color:#6b2f8a; background:rgba(150,80,190,.10); border-color:rgba(150,80,190,.24)}
  .b-beta {color:#8a5411; background:rgba(230,150,40,.12); border-color:rgba(230,150,40,.28)}
  .b-x    {color:#3a4657; background:rgba(90,120,150,.11); border-color:rgba(90,120,150,.26)}
  :root[data-theme="dark"] .b-store{color:#bcd4ff;background:rgba(110,163,255,.13);border-color:rgba(110,163,255,.26)}
  :root[data-theme="dark"] .b-live {color:#8ff0c4;background:rgba(72,213,151,.12);border-color:rgba(72,213,151,.26)}
  :root[data-theme="dark"] .b-mac  {color:#e9d6ff;background:rgba(179,132,181,.14);border-color:rgba(179,132,181,.28)}
  :root[data-theme="dark"] .b-beta {color:#ffd9a6;background:rgba(255,180,74,.12);border-color:rgba(255,180,74,.28)}
  :root[data-theme="dark"] .b-x    {color:#cfe0ee;background:rgba(120,150,180,.14);border-color:rgba(150,175,200,.28)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .b-store{color:#bcd4ff;background:rgba(110,163,255,.13);border-color:rgba(110,163,255,.26)}
    :root:not([data-theme="light"]) .b-live {color:#8ff0c4;background:rgba(72,213,151,.12);border-color:rgba(72,213,151,.26)}
    :root:not([data-theme="light"]) .b-mac  {color:#e9d6ff;background:rgba(179,132,181,.14);border-color:rgba(179,132,181,.28)}
    :root:not([data-theme="light"]) .b-beta {color:#ffd9a6;background:rgba(255,180,74,.12);border-color:rgba(255,180,74,.28)}
    :root:not([data-theme="light"]) .b-x    {color:#cfe0ee;background:rgba(120,150,180,.14);border-color:rgba(150,175,200,.28)}
  }

  /* ---- Footer ---------------------------------------------------------- */
  .sitelinks{margin-top:60px; padding-top:22px; border-top:1px solid var(--border)}
  .sitelinks h2{font:600 11px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase;
    color:var(--mute); margin:0 0 12px}
  .sitelinks ul{list-style:none; padding:0; margin:0; display:flex; flex-wrap:wrap; gap:9px 18px}
  .sitelinks a{color:var(--dim); text-decoration:none; font-size:13.5px}
  .sitelinks a:hover{color:var(--accent); text-decoration:underline}
  footer{margin-top:40px; padding-top:22px; border-top:1px solid var(--border);
    color:var(--mute); font-size:13px; display:flex; justify-content:space-between;
    flex-wrap:wrap; gap:10px}
  footer a{color:var(--dim); text-decoration:none}
  footer a:hover{color:var(--accent)}

  .empty{display:none; color:var(--mute); padding:24px 0}
  section.hidden{display:none}
  @media (max-width:560px){ header.top{padding-top:52px} .grid{grid-template-columns:1fr} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="head-txt">
      <p class="eyebrow">dancykier.com</p>
      <h1>Everything I've built.</h1>
      <p class="lede">iOS apps, web games, Mac utilities and a few Twitter bots — twenty-nine of them. Tap anything to open it.</p>
    </div>
    <button class="theme-btn" id="theme" type="button" aria-label="Switch between light and dark mode" title="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z"/></svg>
    </button>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Filter…" autocomplete="off" spellcheck="false" aria-label="Filter apps">
  </div>

  <main id="sections"></main>
  <p class="empty" id="empty">Nothing matches that.</p>

  <nav class="sitelinks" aria-label="All projects">
    <h2>All projects</h2>
    <ul id="sitelinks"></ul>
  </nav>

  <footer>
    <span>Built by Moshe Dancykier</span>
    <span><a href="mailto:general@dancykier.com">general@dancykier.com</a></span>
  </footer>
</div>

<script>
// The catalog. Add an app by adding one object here — there is no build step.
// n=name, d=description, u=url, b=badge key, ic=icon slug (icons/<ic>.png),
// h=@handle, bot=true for a round avatar, cta=custom badge label.
const SECTIONS = [
  { title:"iOS apps", apps:[
    { n:"Jukebox",       d:"Guests vote on the party playlist. No code to join.", u:"https://jukebox.dancykier.com", b:"store", ic:"jukebox" },
    { n:"Stitch",        d:"Combine iPhone screenshots into one long, seam-matched image.", u:"https://stitch.dancykier.com", b:"store", ic:"stitch" },
    { n:"Pollenary",     d:"Daily pollen forecast with a morning push.", u:"https://pollenary.dancykier.com", b:"store", ic:"pollen" },
    { n:"Sports Alerts", d:"Real-time baseball prospect & call-up notifications.", u:"https://sportsalerts.dancykier.com", b:"live", ic:"sportsalerts" },
    { n:"Bus Tracker",   d:"See the bus on a live map, and get told when it is nearly at the stop.", u:"https://bustracker.dancykier.com", b:"store", ic:"bustracker" },
    { n:"GroupSnap",     d:"One shared camera roll for everyone at your event.", u:"https://groupsnap.dancykier.com", b:"live", ic:"groupsnap" },
    { n:"Dish It Out",   d:"Rate the dish, not the restaurant. Notes you share with friends.", u:"https://dishitout.dancykier.com", b:"beta", ic:"dishitout" },
    { n:"Media Check",   d:"Is this movie or show OK for my kid? Five severity scores.", u:"https://mediacheck.dancykier.com", b:"beta", ic:"mediacheck" },
    { n:"Intercom",      d:"Open the mic; everyone in the room hears you, phone locked.", u:"https://intercom.dancykier.com", b:"beta", ic:"intercom" },
    { n:"Wordbox",       d:"Word games you play with friends, at your own pace.", u:"https://wordbox.dancykier.com", b:"store", ic:"wordbox" },
  ]},
  { title:"Twitter bots", apps:[
    { n:"MLB Home Runs",      h:"@mlbhomerbot",      d:"Every homer, plus how many parks it would clear.", u:"https://x.com/mlbhomerbot", b:"x", ic:"homerbot", bot:true, cta:"Follow" },
    { n:"MLB Prospects",      h:"@mlbprospectsbot",  d:"Every call-up and MLB debut, the moment it's official.", u:"https://x.com/mlbprospectsbot", b:"x", ic:"prospectsbot", bot:true, cta:"Follow" },
    { n:"MLB Bulk & Openers", h:"@MLBBulkbot",       d:"Opener and bulk-pitcher calls before first pitch.", u:"https://x.com/MLBBulkbot", b:"x", ic:"bulkbot", bot:true, cta:"Follow" },
    { n:"MLB Injuries",       h:"@MLBInjuryBot",     d:"Injuries and IL moves the moment they're reported.", u:"https://x.com/MLBInjuryBot", b:"x", ic:"injurybot", bot:true, cta:"Follow" },
    { n:"MLB Closers",        h:"@mlbclosersbot",    d:"Save situations and closer role changes as they shift.", u:"https://x.com/mlbclosersbot", b:"x", ic:"closersbot", bot:true, cta:"Follow" },
  ]},
  { title:"Web & games", apps:[
    { n:"Pinpoint",             d:"Read a clue, drop a pin — unlimited geography practice.", u:"https://geo.dancykier.com", b:"live", ic:"pinpoint" },
    { n:"Chobes Roto Inspector",d:"Live monthly roto standings for a fantasy league.", u:"https://chobes.dancykier.com", b:"live", ic:"chobes" },
    { n:"Games",                d:"A hub of quick browser games.", u:"https://games.dancykier.com", b:"live", ic:"games" },
    { n:"Hexicon",              d:"Spelling-bee style word hunt from a honeycomb.", u:"https://spellingbee.dancykier.com", b:"live", ic:"hexicon" },
    { n:"Scramble",             d:"Find every word in the shaken grid.", u:"https://boggle.dancykier.com", b:"live", ic:"boggle" },
    { n:"Anagrams",             d:"Unscramble against the clock.", u:"https://anagrams.dancykier.com", b:"live", ic:"anagrams" },
    { n:"Intercom (web)",       d:"The same voice rooms, in a browser. No account.", u:"https://intercom.dancykier.com", b:"live", ic:"intercom" },
    { n:"Angry Men Rankings",   d:"Live humor standings. Voting is by private link only.", u:"https://amhumor.dancykier.com", b:"live", ic:"angrymen" },
  ]},
  { title:"Mac apps", apps:[
    { n:"Beam",              d:"A Spotlight-style search bar that also computes.", u:"https://beam.dancykier.com", b:"mac", ic:"beam", cta:"Download" },
    { n:"TextLift",          d:"Drag a region on screen; the text lands on your clipboard.", u:"https://github.com/moshed/TextLift", b:"mac", ic:"textlift", cta:"GitHub" },
    { n:"Clipboard History", d:"A fast, searchable panel of everything you've copied.", u:"https://github.com/moshed/Clipboard-Manager", b:"mac", ic:"clipboard", cta:"GitHub" },
    { n:"ClaudeBar",         d:"Menu-bar notifications for Claude Code, one click to the terminal.", u:"https://github.com/moshed/ClaudeBar", b:"mac", ic:"claudebar", cta:"GitHub" },
    { n:"RunApp",            d:"One-tap launcher for my iOS apps, with a live log viewer.", u:"https://github.com/moshed/run-app", b:"mac", ic:"runapp", cta:"GitHub" },
    { n:"ClipPiP",           d:"Float your clipboard in an always-on-top PiP panel.", u:"https://github.com/moshed/ClipPiP", b:"mac", ic:"clippip", cta:"GitHub" },
  ]},
];

const BADGE = { store:["b-store","App Store"], live:["b-live","Live"], mac:["b-mac","macOS"],
                beta:["b-beta","TestFlight"], x:["b-x","X"] };
const V = 10;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const wrap = document.getElementById('sections');
SECTIONS.forEach(sec=>{
  const s = document.createElement('section');
  s.innerHTML = `<div class="sec-head"><h2>${esc(sec.title)}</h2><span class="rule"></span></div>`;
  const g = document.createElement('div'); g.className = 'grid';
  sec.apps.forEach(a=>{
    const [bc,bl] = BADGE[a.b] || BADGE.live;
    const linked = !!a.u;
    const el = document.createElement(linked ? 'a' : 'div');
    el.className = 'c' + (a.bot ? ' bot' : '');
    if(linked){ el.href = a.u; el.target = '_blank'; el.rel = 'noopener'; }
    el.dataset.k = (a.n + ' ' + a.d + ' ' + (a.h||'') + ' ' + sec.title).toLowerCase();
    el.innerHTML =
      `<img class="ic" loading="lazy" src="icons/${a.ic}.png?v=${V}" alt="">`+
      `<div class="txt">`+
        `<div class="nm">${esc(a.n)}${a.h?`<span class="hd">${esc(a.h)}</span>`:''}</div>`+
        `<div class="ds">${esc(a.d)}</div>`+
      `</div>`+
      `<span class="badge ${bc}">${esc(a.cta||bl)}</span>`;
    g.appendChild(el);
  });
  s.appendChild(g);
  wrap.appendChild(s);
});

// Build the crawlable link list from the same catalog.
const linkWrap = document.getElementById('sitelinks');
SECTIONS.forEach(sec => sec.apps.forEach(a=>{
  if(!a.u) return;
  const li = document.createElement('li');
  li.innerHTML = `<a href="${a.u}">${esc(a.n)}</a>`;
  linkWrap.appendChild(li);
}));

// ---- Filtering ---------------------------------------------------------
const q = document.getElementById('q'), empty = document.getElementById('empty');
function render(){
  const term = q.value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll('#sections section').forEach(sec=>{
    let shown = 0;
    sec.querySelectorAll('.c').forEach(c=>{
      const hit = !term || c.dataset.k.includes(term);
      c.style.display = hit ? '' : 'none'; if(hit) shown++;
    });
    sec.classList.toggle('hidden', shown === 0); if(shown) any = true;
  });
  empty.style.display = any ? 'none' : 'block';
}
q.addEventListener('input', render);

// "/" focuses the filter box; Escape clears it.
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  if(e.key === 'Escape' && document.activeElement === q){ q.value=''; render(); q.blur(); }
});

// ---- Theme toggle ------------------------------------------------------
const root = document.documentElement;
const sysDark = window.matchMedia('(prefers-color-scheme: dark)');
document.getElementById('theme').addEventListener('click', ()=>{
  const cur = root.getAttribute('data-theme') || (sysDark.matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('theme', next); }catch(e){}
});
</script>
</body>
</html>
